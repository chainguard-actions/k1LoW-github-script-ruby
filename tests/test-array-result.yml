name: Test array result with JSON encoding
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: ruby -e "require 'json'; File.open(ENV['GITHUB_OUTPUT'],'a'){|f|f.puts 'result='+JSON.generate([1,2,3])}"
          github-token: "dummy-token"
      - name: Assert result is JSON array with expected values
        env:
          ACTUAL: ${{ steps.action.outputs.result }}
        run: |
          echo "actual: $ACTUAL"
          LENGTH=$(echo "$ACTUAL" | python3 -c "import sys, json; d=json.load(sys.stdin); print(len(d))")
          FIRST=$(echo "$ACTUAL" | python3 -c "import sys, json; d=json.load(sys.stdin); print(d[0])")
          echo "length: $LENGTH"
          echo "first: $FIRST"
          if [ "$LENGTH" != "3" ]; then
            echo "FAIL: expected length=3, got '$LENGTH'"
            exit 1
          fi
          if [ "$FIRST" != "1" ]; then
            echo "FAIL: expected first element=1, got '$FIRST'"
            exit 1
          fi
          echo "PASS"
