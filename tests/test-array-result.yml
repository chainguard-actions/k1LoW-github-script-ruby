name: Test Ruby script returning a JSON array
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        env:
          INPUT_RESULT_ENCODING: json
        with:
          result-encoding: json
          script: |
            [1, 2, 3]

      - name: Assert result is a JSON array
        env:
          ACTUAL: ${{ steps.action.outputs.result }}
        run: |
          echo "actual: $ACTUAL"
          # Parse the JSON array and check length
          LEN=$(echo "$ACTUAL" | python3 -c "import sys,json; d=json.load(sys.stdin); print(len(d))")
          FIRST=$(echo "$ACTUAL" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d[0])")
          echo "length: $LEN"
          echo "first element: $FIRST"
          if [ "$LEN" != "3" ]; then
            echo "FAIL: expected array length 3 but got '$LEN'"
            exit 1
          fi
          if [ "$FIRST" != "1" ]; then
            echo "FAIL: expected first element 1 but got '$FIRST'"
            exit 1
          fi
          echo "PASS"
