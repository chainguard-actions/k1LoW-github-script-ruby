name: Test basic Ruby script execution
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: ruby -e "require 'json'; File.open(ENV['GITHUB_OUTPUT'],'a'){|f|f.puts 'result='+JSON.generate(42)}"
          github-token: "dummy-token"
      - name: Assert result equals 42
        env:
          ACTUAL: ${{ steps.action.outputs.result }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "42" ]; then
            echo "FAIL: expected '42', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
