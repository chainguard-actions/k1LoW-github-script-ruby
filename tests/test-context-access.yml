name: Test Ruby script accessing GitHub context
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        env:
          INPUT_RESULT_ENCODING: string
        with:
          result-encoding: string
          script: |
            context.event_name

      - name: Assert context event_name is accessible
        env:
          ACTUAL: ${{ steps.action.outputs.result }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected non-empty event_name from context"
            exit 1
          fi
          echo "PASS: event_name = $ACTUAL"
