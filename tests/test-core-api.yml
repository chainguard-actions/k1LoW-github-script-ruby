name: Test Ruby script using core API methods
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        env:
          INPUT_RESULT_ENCODING: string
        with:
          result-encoding: string
          script: |
            core.info("Running core API test")
            "core-api-works"

      - name: Assert result from script using core.info
        env:
          ACTUAL: ${{ steps.action.outputs.result }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "core-api-works" ]; then
            echo "FAIL: expected 'core-api-works' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
