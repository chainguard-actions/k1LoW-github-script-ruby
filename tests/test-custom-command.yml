name: Test custom command instead of script
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        env:
          INPUT_COMMAND: "echo 'result=custom-works' >> \"$GITHUB_OUTPUT\""
        with:
          command: "echo 'result=custom-works' >> \"$GITHUB_OUTPUT\""

      - name: Assert custom command ran and set output
        env:
          ACTUAL: ${{ steps.action.outputs.result }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "custom-works" ]; then
            echo "FAIL: expected 'custom-works' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
