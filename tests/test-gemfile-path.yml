name: Test gemfile-path input (path to custom Gemfile)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          # The Docker container mounts GITHUB_WORKSPACE at /github/workspace,
          # so the fixture Gemfile is accessible at that path inside the container.
          gemfile-path: /github/workspace/hardened/tests/fixtures/custom-gemfile/Gemfile
          result-encoding: string
          script: |
            "gemfile-path-ok"

      - name: Assert result from gemfile-path
        env:
          ACTUAL: ${{ steps.action.outputs.result }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "gemfile-path-ok" ]; then
            echo "FAIL: expected 'gemfile-path-ok' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
