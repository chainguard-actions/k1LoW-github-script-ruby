name: Test gemfile-path input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          script: |
            "hello from gemfile-path test"
          result-encoding: string
          gemfile-path: ${{ github.workspace }}/actions/hardened/k1LoW--github-script-ruby/v2.6.2/tests/fixtures/Gemfile
      - name: Assert result
        env:
          ACTUAL: ${{ steps.action.outputs.result }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "hello from gemfile-path test" ]; then
            echo "FAIL: expected 'hello from gemfile-path test', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
