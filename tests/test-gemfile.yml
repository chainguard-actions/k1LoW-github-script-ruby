name: Test gemfile input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          gemfile: |
            source "https://rubygems.org"
            gem "json"
          script: |
            require 'json'
            JSON.generate({status: "ok"})
          result-encoding: string
      - name: Assert result output
        env:
          ACTUAL: ${{ steps.action.outputs.result }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected non-empty result"
            exit 1
          fi
          echo "PASS"
