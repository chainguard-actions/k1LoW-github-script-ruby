name: Test JSON result encoding with hash
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        env:
          INPUT_SCRIPT: '{ "key" => "value", "number" => 123 }'
          INPUT_RESULT_ENCODING: "json"
        with:
          script: |
            { "key" => "value", "number" => 123 }
          result-encoding: json
      - name: Assert result is valid JSON with expected keys
        env:
          ACTUAL: ${{ steps.action.outputs.result }}
        run: |
          echo "actual: $ACTUAL"
          KEY=$(echo "$ACTUAL" | python3 -c "import sys, json; d=json.load(sys.stdin); print(d['key'])")
          NUMBER=$(echo "$ACTUAL" | python3 -c "import sys, json; d=json.load(sys.stdin); print(d['number'])")
          echo "key: $KEY"
          echo "number: $NUMBER"
          if [ "$KEY" != "value" ]; then
            echo "FAIL: expected key='value', got '$KEY'"
            exit 1
          fi
          if [ "$NUMBER" != "123" ]; then
            echo "FAIL: expected number=123, got '$NUMBER'"
            exit 1
          fi
          echo "PASS"
