name: Test Ruby script with pre-command
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        env:
          INPUT_RESULT_ENCODING: string
          INPUT_PRE_COMMAND: "echo 'pre-command executed' > /tmp/pre_command_marker.txt"
        with:
          result-encoding: string
          pre-command: "echo 'pre-command executed' > /tmp/pre_command_marker.txt"
          script: |
            File.read('/tmp/pre_command_marker.txt').strip

      - name: Assert pre-command ran before script
        env:
          ACTUAL: ${{ steps.action.outputs.result }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "pre-command executed" ]; then
            echo "FAIL: expected 'pre-command executed' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
