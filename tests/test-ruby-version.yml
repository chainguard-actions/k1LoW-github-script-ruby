name: Test ruby-version input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          script: |
            RUBY_VERSION
          result-encoding: string
          ruby-version: "3.2"
      - name: Assert result contains version
        env:
          ACTUAL: ${{ steps.action.outputs.result }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected a non-empty ruby version string"
            exit 1
          fi
          echo "PASS: ruby version is $ACTUAL"
