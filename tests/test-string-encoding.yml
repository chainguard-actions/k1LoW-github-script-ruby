name: Test Ruby script with string result encoding
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        env:
          INPUT_RESULT_ENCODING: string
        with:
          result-encoding: string
          script: '"hello world"'

      - name: Assert result is plain string (not JSON-quoted)
        env:
          ACTUAL: ${{ steps.action.outputs.result }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "hello world" ]; then
            echo "FAIL: expected 'hello world' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
