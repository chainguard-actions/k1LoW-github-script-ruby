name: Test string result encoding
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: ruby -e "File.open(ENV['GITHUB_OUTPUT'],'a'){|f|f.puts 'result=hello world'}"
          github-token: "dummy-token"
      - name: Assert result equals hello world
        env:
          ACTUAL: ${{ steps.action.outputs.result }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "hello world" ]; then
            echo "FAIL: expected 'hello world', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
